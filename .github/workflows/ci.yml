name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/ibex-ci
          NEXTAUTH_SECRET: ci-nextauth-secret-at-least-32-chars
          NEXTAUTH_URL: http://localhost:3000
          APP_URL: http://localhost:3000

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
      - name: Build
        run: npm run build
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/ibex-e2e
          NEXTAUTH_SECRET: e2e-nextauth-secret-at-least-32-chars
          NEXTAUTH_URL: http://127.0.0.1:3000
          APP_URL: http://127.0.0.1:3000
      - name: Playwright smoke
        run: npm run test:e2e
        env:
          CI: "true"
          MONGODB_URI: mongodb://127.0.0.1:27017/ibex-e2e
          NEXTAUTH_SECRET: e2e-nextauth-secret-at-least-32-chars
          NEXTAUTH_URL: http://127.0.0.1:3000
          APP_URL: http://127.0.0.1:3000
