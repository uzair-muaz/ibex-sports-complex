# Nginx reverse proxy for staging.ibexsportscomplex.com
# Behind Cloudflare: set SSL/TLS mode to "Full" (or Full strict after certbot).
# If you only have HTTP on the origin, use Cloudflare "Flexible" temporarily,
# then run SETUP_SSL=1 and switch to Full.

upstream ibex_next {
    server 127.0.0.1:3000;
    keepalive 64;
}

map $http_x_forwarded_proto $ibex_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    listen [::]:80;
    server_name staging.ibexsportscomplex.com;

    # Uncomment after certbot if you want HTTP→HTTPS on origin
    # (Cloudflare can also force HTTPS at the edge).
    # return 301 https://$host$request_uri;

    client_max_body_size 20M;

    location /api/health {
        proxy_pass http://ibex_next/api/auth/session;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $ibex_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location / {
        proxy_pass http://ibex_next;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ibex_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Cloudflare → origin
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Avoid buffering quirks with Next.js streaming
        proxy_buffering off;
    }
}
